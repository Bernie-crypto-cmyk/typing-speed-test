<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Test your typing speed</title>
</head>
<body>
    <header class="header">
        <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#F7D774" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 7.5A2.25 2.25 0 0 1 4.5 5.25h15a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25v-9Z" />
  <path stroke-linecap="round" stroke-linejoin="round" d="M6 9h.008v.008H6V9Zm3 0h.008v.008H9V9Zm3 0h.008v.008H12V9Zm3 0h.008v.008H15V9Zm3 0h.008v.008H18V9ZM6 12h.008v.008H6V12Zm3 0h.008v.008H9V12Zm3 0h.008v.008H12V12Zm3 0h.008v.008H15V12Zm3 0h.008v.008H18V12ZM8.25 15h7.5" />
</svg>

<div class="best-score-wrap">
    <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#F7D774" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0" />
</svg>
<div class="best-score">
    <div>Best:</div>
    <div id="score">0</div>
    <span>WPM</span>
</div>
</div>
    </header>
    <main class="hero">
        <div class="stat-desktop-view">
        <section class="stat-container">
            <div class="stat">
                <div class="stat-description">WPM</div>
                <div id="wpm" class="stat-data">0</div>
            </div>
            <div class="stat">
                 <div class="stat-description">Accuracy</div>
                <div id="accuracy" class="stat-data">0</div>
            </div>
            <div class="stat">
                 <div class="stat-description">Time</div>
                <div id="time" class="stat-data"></div>
            </div>
        </section>
        <section class="mode-container">
           <select class="difficulty">
            <option value="Easy" selected>Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
           </select>

           <select class="mode">
            <option value="timedd" selected>Timed (60s)</option>
            <option value="passage">Passage</option>
           </select>

        </section>
        </div>
        <section class="test-text-container">
            <button class="start-button">Start Typing Test</button>
            <input class="input" type="text">
        </section>
        </section>
        <script src="script.js"></script>
    </main>
</body>
</html>
