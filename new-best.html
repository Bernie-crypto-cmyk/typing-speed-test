<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        #confetti{
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
    <title>New personal best</title>
</head>
<body>
    <canvas id="confetti"></canvas>
    <header class="header">

  <path stroke-linecap="round" stroke-linejoin="round" d="M6 9h.008v.008H6V9Zm3 0h.008v.008H9V9Zm3 0h.008v.008H12V9Zm3 0h.008v.008H15V9Zm3 0h.008v.008H18V9ZM6 12h.008v.008H6V12Zm3 0h.008v.008H9V12Zm3 0h.008v.008H12V12Zm3 0h.008v.008H15V12Zm3 0h.008v.008H18V12ZM8.25 15h7.5" />
</svg>

<div class="best-score-wrap">
    <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#F7D774" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0" />
</svg>
<div class="best-score">
    <div>Best:</div>
    <div id="score">0</div>
    <span>WPM</span>
</div>
</div>
    </header>
<div class="tick-icon-container">
    <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#F7D774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Confetti" xmlns:c2pa="http://c2pa.org/manifest">  <!-- party popper cone -->
  <path d="M3 21 6.8 9.6a1 1 0 0 1 1.66-.4l6.34 6.34a1 1 0 0 1-.4 1.66L3 21Z"/>
  <!-- cone stripes -->
  <path d="M5.2 14.6 9.4 18.8"/>
  <path d="M7.3 11.4 12.6 16.7"/>

  <path d="M12.5 6.5c.4-1.4.2-2.8-.5-4"/>
  <path d="M15 9c1.4-.9 3-1.2 4.8-.8"/>
  <path d="M16.5 12.2c1.6-.2 3.2.2 4.5 1.2"/>

  <path d="M18 4.5 19.2 3.3"/>

  <path d="M20.5 18h.01"/>

</svg>

</div>
<h1 class="result-heading">High Score Smashed!</h1>
<p class="result-description">You are getting faster. That was incredible typing.</p>
<div id="result-container" class="result-container">
    <div class="result">
    <div class="result-wpm">WPM :</div>
    <div class="result-wpm-value"></div>
</div>
<div class="result">
    <div class="result-accuracy">Accuracy :</div>
    <div class="result-accuracy-value"></div>
</div>
<div class="result">
    <div class="result-time">Time :</div>
    <div class="result-time-value"></div>
</div>
</div>
<div class="result-beat-button-container">
<button class="result-beat-button">Go Again<svg class="beat-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
</svg>
</button>
</div>
<script src="result-script.js"></script>
<script>
    const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
const COLORS = ['#ef4444', '#22c55e', '#3b82f6', '#facc15'];
let pieces = [];
let running = false;

    function fireConfetti(count = 80) {
  for (let i = 0; i < count; i++) {
    pieces.push({
      x: Math.random() * innerWidth,
      y: -20 - Math.random() * innerHeight * 0.4, // staggered start above the screen
      w: 4 + Math.random() * 4,                   // small rectangle
      h: 8 + Math.random() * 8,
      vx: (Math.random() - 0.5) * 2,              // sideways drift
      vy: 2 + Math.random() * 3,                  // fall speed
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,            // spin
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
};
function tick() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of pieces) {
    p.x += p.vx + Math.sin(p.y / 30) * 0.5; // gentle sway
    p.y += p.vy;
    p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  pieces = pieces.filter(p => p.y < innerHeight + 30); // drop pieces that left the screen
  if (pieces.length) requestAnimationFrame(tick);
  else running = false;
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();
fireConfetti();
</script>
</body>
</html>
